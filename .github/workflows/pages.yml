name: Web app (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # build and upload in one job, deploy in another: deploy-pages then finds the
  # finished artifact, and "Re-run failed jobs" re-runs only the deploy without
  # uploading a second github-pages artifact
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: python3 tools/build.py
      # the trailer is hosted on Pages (GitHub's file viewer can't play video)
      # but kept out of www/ so it doesn't get packaged into the Android APK
      - name: Stage site
        run: |
          mkdir _site
          cp -r www/. _site/
          cp docs/trailer.mp4 _site/trailer.mp4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
