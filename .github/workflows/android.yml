name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # the runner image already includes the Android SDK (ANDROID_HOME)

      - name: Build the web app
        run: python3 tools/build.py

      - name: Install
        run: npm ci

      - name: Create the Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
          # every build gets a higher version number so installs update in place
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle

      - name: Build the APK
        run: |
          # a fixed signing key, so a new APK installs over the old one and keeps progress
          mkdir -p ~/.android && cp tools/debug.keystore ~/.android/debug.keystore
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PolyglotGameMaster.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PolyglotGameMaster-apk
          path: PolyglotGameMaster.apk

      - name: Publish as the "latest" download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: false
          body: "Newest Android build from the main branch. Download **PolyglotGameMaster.apk** below and open it on your phone."
          files: PolyglotGameMaster.apk

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PolyglotGameMaster.apk
          generate_release_notes: true
