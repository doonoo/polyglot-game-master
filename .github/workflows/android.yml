name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # the runner image already includes the Android SDK (ANDROID_HOME)

      - name: Build the web app
        run: python3 tools/build.py

      - name: Install
        run: npm ci

      - name: Sync the web app into the Android project
        run: |
          npx cap sync android
          # every build gets a higher version number so installs update in place
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"[0-9.]*\"/versionName \"1.0.${GITHUB_RUN_NUMBER}-ci\"/" android/app/build.gradle

      - name: Build the APK
        env:
          KEYSTORE_B64: ${{ secrets.PGM_KEYSTORE_BASE64 }}
          PGM_KEYSTORE_PASSWORD: ${{ secrets.PGM_KEYSTORE_PASSWORD }}
          PGM_KEY_ALIAS: ${{ secrets.PGM_KEY_ALIAS }}
          PGM_KEY_PASSWORD: ${{ secrets.PGM_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # signed release build with the private key kept in the repo secrets
            # tolerate spaces or line breaks picked up while pasting the secret
            printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/release.keystore" \
              || { echo "::error::PGM_KEYSTORE_BASE64 is not valid base64. Paste only the long line from the secrets file."; exit 1; }
            keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storetype PKCS12 -storepass "$PGM_KEYSTORE_PASSWORD" -alias "$PGM_KEY_ALIAS" > /dev/null \
              || { echo "::error::The keystore did not open. Check PGM_KEYSTORE_PASSWORD and PGM_KEY_ALIAS."; exit 1; }
            export PGM_KEYSTORE="$RUNNER_TEMP/release.keystore"
            cd android && ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../PolyglotGameMaster.apk
            rm -f "$PGM_KEYSTORE"
          else
            # no secrets yet: fall back to the shared debug key so sideloaded updates still install
            mkdir -p ~/.android && cp tools/debug.keystore ~/.android/debug.keystore
            cd android && ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../PolyglotGameMaster.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PolyglotGameMaster-apk
          path: PolyglotGameMaster.apk

      - name: Publish as the "latest" download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: false
          body: "Newest Android build from the main branch. Download **PolyglotGameMaster.apk** below and open it on your phone."
          files: PolyglotGameMaster.apk

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PolyglotGameMaster.apk
          generate_release_notes: true
